<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incidencias del aula</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>Incidencias del aula</h1>
    <p id="reloj"></p>
  </header>

  <main>
    <section class="tarjeta">
      <h2>Nueva incidencia</h2>
      <p id="saludo"></p>
      <label>Tu nombre <input type="text" id="autor"></label>
      <label>Equipo <input type="text" id="equipo" placeholder="Ej.: PC07"></label>
      <label>Prioridad
        <select id="prioridad">
          <option value="alta">Alta</option>
          <option value="media" selected>Media</option>
          <option value="baja">Baja</option>
        </select>
      </label>
      <label>Descripción <input type="text" id="descripcion"></label>
      <button type="button" id="enviar">Guardar incidencia</button>
      <p id="aviso"></p>
    </section>

    <section class="tarjeta">
      <h2>Incidencias</h2>
      <p id="resumen"></p>
      <div id="lista"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
