name: Publicar web

# Cada vez que subes cambios a main:
#  1) regenera el índice de prácticas y lo guarda en la rama "indice"
#  2) publica la web si Pages está configurado con "GitHub Actions"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar índice de prácticas
        run: python3 scripts/generar-indice.py . "$RUNNER_TEMP/indice.json"

      - name: Guardar indice.json en la rama indice
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir "$RUNNER_TEMP/idx"
          cp "$RUNNER_TEMP/indice.json" "$RUNNER_TEMP/idx/"
          cd "$RUNNER_TEMP/idx"
          git init -q -b indice
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indice.json
          git commit -q -m "Actualizar indice.json"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" indice

  publicar:
    runs-on: ubuntu-latest
    # Si Pages usa "Deploy from a branch", este trabajo no hace falta y puede fallar sin problema.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generar índice de prácticas
        run: python3 scripts/generar-indice.py . indice.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
