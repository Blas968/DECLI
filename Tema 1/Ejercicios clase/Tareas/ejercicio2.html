<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ejercicio 2</title>
</head>
<body>

  <h1>Secuencia de imágenes</h1>
  <p>Haz clic sobre la imagen para ver la siguiente.</p>

  <img id="imagen"
       src="https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/Marc_Cucurella_France_v_Spain_7.24.26-149_%28cropped%29.jpg/250px-Marc_Cucurella_France_v_Spain_7.24.26-149_%28cropped%29.jpg?utm_source=es.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"
       width="500"
       onclick="siguiente()">

  <script>
    var imagenes = [
      "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/Marc_Cucurella_France_v_Spain_7.24.26-149_%28cropped%29.jpg/250px-Marc_Cucurella_France_v_Spain_7.24.26-149_%28cropped%29.jpg?utm_source=es.wikipedia.org&utm_campaign=parser&utm_content=thumbnail",
      "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Spain-Tahiti%2C_Confederations_Cup_2013_%2802%29_%28Villa_crop%29.jpg/250px-Spain-Tahiti%2C_Confederations_Cup_2013_%2802%29_%28Villa_crop%29.jpg?utm_source=es.wikipedia.org&utm_campaign=parser&utm_content=thumbnail",
      "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d8/Nico_Williams_France_v_Spain_7.24.26-030.jpg/250px-Nico_Williams_France_v_Spain_7.24.26-030.jpg?utm_source=es.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"
    ];

    var posicion = 0;

    function siguiente() {
      posicion = posicion + 1;

      if (posicion == imagenes.length) {
        posicion = 0;
      }

      document.getElementById("imagen").src = imagenes[posicion];
    }
  </script>

</body>
</html>
