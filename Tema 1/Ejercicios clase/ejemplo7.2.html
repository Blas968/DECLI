<html>
<body>

    <h1>Cambio de imágenes con JavaScript</h1>

    <img id="myFPImage"
         onclick="cambiaPic()"
         src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSdI5GsuqMzmF-HvJnIEs6RrEb_XIJLSe4HwPDJpNfRbqCZ06XS6h6ZKx3N&s=10"
         width="300"
         height="280">

    <p>Haz click sobre la imagen para cambiarla.</p>

    <script>
        var cambiada = false;

        function cambiaPic() {
            var image = document.getElementById('myFPImage');

            if (cambiada == false) {
                image.src = "https://media.vandalsports.com/i/640x360/5-2026/2026559571_1.jpg";
                cambiada = true;
            } else {
                image.src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSdI5GsuqMzmF-HvJnIEs6RrEb_XIJLSe4HwPDJpNfRbqCZ06XS6h6ZKx3N&s=10";
                cambiada = false;
            }
        }
    </script>

</body>
</html>
