<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tema 2 - Eventos con 'on...'</title>
</head>
<body>

  <h2>Eventos con prefijo 'on'</h2>

  <!-- ========================================== -->
  <!-- EVENTOS DE RATÓN                           -->
  <!-- ========================================== -->
  
  <!-- Ratón 1: onclick -->
  <button onclick="alHacerClic()">1. Hacer clic aquí</button>

  <br><br>

  <!-- Ratón 2: onmouseover -->
  <div onmouseover="alPasarElRaton(this)" style="background: #e2e8f0; padding: 10px; width: 250px;">
    2. Pasa el ratón por encima de esta caja
  </div>

  <hr>

  <!-- ========================================== -->
  <!-- EVENTOS DE TEXTO / TECLADO                 -->
  <!-- ========================================== -->

  <!-- Texto 1: oninput (se activa mientras el usuario escribe) -->
  <label>3. Escribe tu nombre (oninput):</label><br>
  <input type="text" oninput="alEscribirTexto(this.value)">

  <br><br>

  <!-- Texto 2: onkeyup (se activa al soltar una tecla) -->
  <label>4. Escribe un texto (onkeyup):</label><br>
  <input type="text" onkeyup="alSoltarTecla(this.value)">

  <!-- Salida de texto en pantalla -->
  <p id="salida"></p>

  <script>
    var salida = document.getElementById("salida");

    // Funciones asociadas a los eventos de ratón
    function alHacerClic() {
      salida.innerText = "¡Has hecho clic en el botón!";
    }

    function alPasarElRaton(caja) {
      caja.innerText = "¡El ratón está sobre la caja!";
    }

    // Funciones asociadas a los eventos de texto
    function alEscribirTexto(valor) {
      salida.innerText = "Nombre en tiempo real: " + valor;
    }

    function alSoltarTecla(valor) {
      console.log("Número de caracteres (Consola F12): " + valor.length);
    }
  </script>

</body>
</html>
