<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function sumar(a, b) {
            return a + b;
        }
        function restar(a, b) {
            return a - b;
        }
        function multiplicar(a, b) {
            return a * b;
        }
        function dividir(a, b) {
            if (b !== 0) {
                return a / b;
            } else {
                console.error("Error: División por cero");
                return null;
            }
        }
    </script>
</body>
</html>
